services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KonradMichalik\Typo3PageMetrics\:
        resource: '../Classes/*'

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\SlugLookup:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\RedirectFollower:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\Resolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Source\Matomo\MatomoConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\DailyMetricsRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\UnresolvedUrlRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\ImportStateRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() instead
    # of going through the backend module route dispatcher.
    KonradMichalik\Typo3PageMetrics\Controller\PageMetricsController:
        arguments:
            $sources: !tagged_iterator page_metrics.metric_source
        public: true

    KonradMichalik\Typo3PageMetrics\Source\Matomo\MatomoMetricSource:
        tags:
            - name: page_metrics.metric_source

    KonradMichalik\Typo3PageMetrics\Command\ImportCommand:
        arguments:
            $sources: !tagged_iterator page_metrics.metric_source
        tags:
            - name: console.command
              command: 'page-metrics:import'
              description: 'Import page metrics from configured sources'
