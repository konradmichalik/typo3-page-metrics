services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Widgets/ is excluded here: those classes implement EXT:dashboard
    # interfaces (WidgetRendererInterface etc.), which don't exist on
    # installations without that optional extension. Autodiscovering them
    # unconditionally would fail to even reflect the classes in that case.
    # Configuration/Services.php registers them instead, gated on
    # EXT:dashboard's presence.
    KonradMichalik\Typo3PageMetrics\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Widgets/*'

    KonradMichalik\Typo3PageMetrics\Analysis\Guard\SpoofingGuardInterface:
        alias: KonradMichalik\Typo3PageMetrics\Analysis\Guard\PathHeuristicGuard

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\SlugLookup:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\RedirectFollower:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\Resolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Provider\Matomo\MatomoConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Service\PageMetricsAccessChecker:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Provider\Ga4\Ga4ConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Provider\AccessLog\AccessLogConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\DailyMetricsRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\UnresolvedUrlRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\ImportStateRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\AnnotationRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\ManualAnnotationRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\BotAgentDailyRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\SitePageUidRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Service\BotAgentDetailCollector:
        public: true

    # Public because GeneralUtility::makeInstance() resolves itemsProcFunc
    # classes directly by class name (see the TCA type=select on
    # tx_typo3pagemetrics_manual_annotation's site_identifier field), the same
    # reason TYPO3 core's own TcaSystemLanguageCollector is public.
    KonradMichalik\Typo3PageMetrics\UserFunction\AnnotationSiteItemsProcFunc:
        public: true

    # Public for the same reason as AnnotationSiteItemsProcFunc above: TCA
    # itemsProcFunc classes are resolved by class name through
    # GeneralUtility::makeInstance(), not through the container's own wiring.
    KonradMichalik\Typo3PageMetrics\UserFunction\AnnotationCategoryItemsProcFunc:
        public: true

    # Public so a functional test can exercise the median and the band
    # directly, rather than inferring them from rendered tile markup.
    KonradMichalik\Typo3PageMetrics\Service\SiteBenchmark:
        public: true

    # The tagged iterator has to be named: autowiring cannot guess which
    # services an iterable parameter stands for.
    KonradMichalik\Typo3PageMetrics\Service\DataFreshnessResolver:
        arguments:
            $providers: !tagged_iterator page_metrics.metric_provider

    # Public so functional tests can fetch it directly via $this->get() instead
    # of dispatching a full ModifyPageLayoutContentEvent.
    KonradMichalik\Typo3PageMetrics\Service\PageMetricsViewDataBuilder:
        arguments:
            $providers: !tagged_iterator page_metrics.metric_provider
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming widget references it.
    KonradMichalik\Typo3PageMetrics\Service\SiteMetricsOverviewBuilder:
        arguments:
            $providers: !tagged_iterator page_metrics.metric_provider
        public: true

    # Public so functional tests can fetch it directly via $this->get() instead
    # of dispatching a real AJAX route request.
    KonradMichalik\Typo3PageMetrics\Controller\Ajax\PageMetricsTilesController:
        public: true

    # Public for the same reason as the tiles controller above.
    KonradMichalik\Typo3PageMetrics\Controller\Ajax\PageMetricsPreferencesController:
        public: true

    # Public so functional tests can assert the stored preference without
    # going through a request, and so the renderer's two states can be set up
    # directly.
    KonradMichalik\Typo3PageMetrics\Service\PageMetricsUserPreferences:
        public: true

    # Public so a functional test can assert the key list against the XLF
    # directly. That seam fails silently otherwise: an unresolvable key is
    # dropped on purpose and the client falls back to English, so a typo would
    # only ever show up as an untranslated label on a translated backend.
    KonradMichalik\Typo3PageMetrics\Service\SparklineLabelProvider:
        public: true

    KonradMichalik\Typo3PageMetrics\Provider\Matomo\MatomoMetricProvider:
        tags:
            - name: page_metrics.metric_provider

    KonradMichalik\Typo3PageMetrics\Provider\Ga4\Ga4MetricProvider:
        tags:
            - name: page_metrics.metric_provider

    KonradMichalik\Typo3PageMetrics\Provider\AccessLog\AccessLogMetricProvider:
        tags:
            - name: page_metrics.metric_provider

    KonradMichalik\Typo3PageMetrics\Provider\Matomo\MatomoAnnotationProvider:
        tags:
            - name: page_metrics.annotation_provider

    KonradMichalik\Typo3PageMetrics\Command\ImportCommand:
        arguments:
            $providers: !tagged_iterator page_metrics.metric_provider
            $annotationProviders: !tagged_iterator page_metrics.annotation_provider
        tags:
            - name: console.command
              command: 'page-metrics:import'
              description: 'Import page metrics from configured providers'

    KonradMichalik\Typo3PageMetrics\Command\AnalyzeCommand:
        tags:
            - name: console.command
              command: 'page-metrics:analyze'
              description: 'Analyze access logs ad hoc, without writing to the database'
