services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Widgets/ is excluded here: those classes implement EXT:dashboard
    # interfaces (WidgetRendererInterface etc.), which don't exist on
    # installations without that optional extension. Autodiscovering them
    # unconditionally would fail to even reflect the classes in that case.
    # Configuration/Services.php registers them instead, gated on
    # EXT:dashboard's presence.
    KonradMichalik\Typo3PageMetrics\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Widgets/*'

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\SlugLookup:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\RedirectFollower:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Resolver\Resolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Source\Matomo\MatomoConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Service\PageMetricsAccessChecker:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Source\Ga4\Ga4ConfigurationResolver:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\DailyMetricsRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\UnresolvedUrlRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\ImportStateRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\AnnotationRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\ManualAnnotationRepository:
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming service references it.
    KonradMichalik\Typo3PageMetrics\Persistence\SitePageUidRepository:
        public: true

    # Public because GeneralUtility::makeInstance() resolves itemsProcFunc
    # classes directly by class name (see the TCA type=select on
    # tx_typo3pagemetrics_manual_annotation's site_identifier field), the same
    # reason TYPO3 core's own TcaSystemLanguageCollector is public.
    KonradMichalik\Typo3PageMetrics\UserFunction\AnnotationSiteItemsProcFunc:
        public: true

    # Public so functional tests can fetch it directly via $this->get() instead
    # of dispatching a full ModifyPageLayoutContentEvent.
    KonradMichalik\Typo3PageMetrics\Service\PageMetricsViewDataBuilder:
        arguments:
            $sources: !tagged_iterator page_metrics.metric_source
        public: true

    # Public so functional tests can fetch it directly via $this->get() before
    # any consuming widget references it.
    KonradMichalik\Typo3PageMetrics\Service\SiteMetricsOverviewBuilder:
        arguments:
            $sources: !tagged_iterator page_metrics.metric_source
        public: true

    # Public so functional tests can fetch it directly via $this->get() instead
    # of dispatching a real AJAX route request.
    KonradMichalik\Typo3PageMetrics\Controller\Ajax\PageMetricsTilesController:
        public: true

    KonradMichalik\Typo3PageMetrics\Source\Matomo\MatomoMetricSource:
        tags:
            - name: page_metrics.metric_source

    KonradMichalik\Typo3PageMetrics\Source\Ga4\Ga4MetricSource:
        tags:
            - name: page_metrics.metric_source

    KonradMichalik\Typo3PageMetrics\Source\Matomo\MatomoAnnotationSource:
        tags:
            - name: page_metrics.annotation_source

    KonradMichalik\Typo3PageMetrics\Command\ImportCommand:
        arguments:
            $sources: !tagged_iterator page_metrics.metric_source
            $annotationSources: !tagged_iterator page_metrics.annotation_source
        tags:
            - name: console.command
              command: 'page-metrics:import'
              description: 'Import page metrics from configured sources'
