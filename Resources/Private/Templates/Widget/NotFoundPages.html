<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">
    <f:if condition="{sites}">
        <f:then>
            <f:for each="{sites}" as="overview" iteration="siteIteration">
                <div class="pagemetrics-widget-site">
                    <f:if condition="{siteIteration.total} > 1">
                        <h3 class="pagemetrics-widget-site-title">{overview.site.identifier}</h3>
                    </f:if>
                    <f:if condition="{overview.unresolvedUrls}">
                        <f:then>
                            <div class="widget-table-wrapper">
                                <table class="widget-table table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th><f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:widget.notFoundPages.column.url" default="URL" /></th>
                                            <th><f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:widget.notFoundPages.column.reason" default="Reason" /></th>
                                            <th class="text-end"><f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:widget.notFoundPages.column.hits" default="Hits" /></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <f:for each="{overview.unresolvedUrls}" as="unresolvedUrl">
                                            <tr>
                                                <td class="col-responsive">
                                                    <a href="{unresolvedUrl.url}" target="_blank" rel="noopener noreferrer" title="{unresolvedUrl.url}">{unresolvedUrl.path}</a>
                                                </td>
                                                <td class="nowrap">
                                                    <span class="badge badge-secondary" data-reason="{unresolvedUrl.reason.value}">
                                                        <f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:unresolved.reason.{unresolvedUrl.reason.value}" default="{unresolvedUrl.reason.value}" />
                                                    </span>
                                                </td>
                                                <td class="text-end nowrap">{unresolvedUrl.value}</td>
                                            </tr>
                                        </f:for>
                                    </tbody>
                                </table>
                            </div>
                        </f:then>
                        <f:else>
                            <div class="callout callout-info">
                                <div class="callout-content">
                                    <div class="callout-title">
                                        <f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:widget.notFoundPages.empty" default="No unresolved URLs in the last 30 days." />
                                    </div>
                                </div>
                            </div>
                        </f:else>
                    </f:if>
                </div>
            </f:for>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="callout-icon">
                    <span class="icon-emphasized"><core:icon identifier="{configuration.iconIdentifier}" /></span>
                </div>
                <div class="callout-content">
                    <div class="callout-title">
                        <f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:widget.empty" default="No page metrics available yet." />
                    </div>
                </div>
            </div>
        </f:else>
    </f:if>
</f:section>
</html>
