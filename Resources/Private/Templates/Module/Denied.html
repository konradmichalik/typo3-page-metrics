<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <f:comment>
        Two refusals, one template, because they are the same answer to the
        reader: this is not yours to see. Which of the two it was still
        matters, so the text differs - a page the user may not read is a
        permission problem they can ask about, while a disabled module is a
        decision somebody made for them.
    </f:comment>
    <div class="callout callout-warning">
        <div class="callout-body">
            <f:if condition="{reason} == 'disabled'">
                <f:then><p><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:module.denied.disabled" default="Page metrics are switched off for your user account." /></p></f:then>
                <f:else><p><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:module.denied.page" default="You do not have permission to see this page." /></p></f:else>
            </f:if>
        </div>
    </div>
</f:section>
</html>
