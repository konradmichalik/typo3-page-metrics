<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<nav class="pagemetrics-period" aria-label="{f:translate(key: 'LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:period.label', default: 'Period')}">
    <f:for each="{periodOptions}" as="option">
        <f:be.link route="web_layout" parameters="{id: pageId, tx_pagemetrics_period: option}" additionalAttributes="{'data-period': option}" class="pagemetrics-period-link{f:if(condition: '{option} == {periodDays}', then: ' pagemetrics-period-link-active')}">{option} <f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:period.days" default="days" /></f:be.link>
    </f:for>
</nav>
<div class="pagemetrics-tiles" data-page-id="{pageId}">
    <f:for each="{tiles}" as="tile">
        <div class="pagemetrics-tile" data-metric="{tile.identifier}" data-label="{tile.label}" data-description="{tile.description}" data-unit="{tile.unit.value}" data-external-link="{tile.externalLink}" data-sparkline="{f:format.json(value: tile.sparkline)}" data-redirect-share="{tile.redirectSharePercent}" style="--pm-accent: {tile.color}" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
            <div class="pagemetrics-tile-head">
                <span class="pagemetrics-tile-icon"><core:icon identifier="{tile.icon}" size="medium" alternativeMarkupIdentifier="inline" /></span>
                <div class="pagemetrics-tile-text">
                    <span class="pagemetrics-tile-main">
                        <span class="pagemetrics-tile-value">{tile.formattedValue}</span>
                        <span class="pagemetrics-tile-delta pagemetrics-tile-delta-{tile.trend.value}">
                            <f:if condition="{tile.trend.value} == 'up'"><f:then><core:icon identifier="tabler-trending-up" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                            <f:if condition="{tile.trend.value} == 'down'"><f:then><core:icon identifier="tabler-trending-down" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                            <f:if condition="{tile.trend.value} == 'flat'"><f:then><core:icon identifier="tabler-minus" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                            <f:if condition="{tile.deltaPercent} !== null">
                                <f:then>{tile.deltaPercent}%</f:then>
                                <f:else><f:translate key="LLL:EXT:page_metrics/Resources/Private/Language/locallang_mod.xlf:trend.new" default="new" /></f:else>
                            </f:if>
                        </span>
                    </span>
                    <span class="pagemetrics-tile-label">{tile.label}</span>
                </div>
            </div>
        </div>
    </f:for>
</div>
</html>
