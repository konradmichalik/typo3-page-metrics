<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="includeSubpagesToggleValue"><f:if condition="{includeSubpages}" then="0" else="1" /></f:variable>
<f:variable name="includeSubpagesDataValue"><f:if condition="{includeSubpages}" then="1" else="0" /></f:variable>
<div class="pagemetrics-toolbar">
    <nav class="pagemetrics-period" aria-label="{f:translate(key: 'LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:period.label', default: 'Period')}">
        <f:for each="{periodOptions}" as="option">
            <f:be.link route="web_layout" parameters="{id: pageId, tx_typo3pagemetrics_period: option}" additionalAttributes="{'data-period': option}" class="pagemetrics-period-link{f:if(condition: '{option} == {periodDays}', then: ' pagemetrics-period-link-active')}">{option} <f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:period.days" default="days" /></f:be.link>
        </f:for>
    </nav>
    <f:if condition="{hasSubpages}">
        <div class="pagemetrics-options">
            <button type="button" class="pagemetrics-options-trigger{f:if(condition: includeSubpages, then: ' pagemetrics-options-trigger-has-active-filter')}" data-options-trigger aria-haspopup="true" aria-expanded="false" aria-label="{f:translate(key: 'LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:options.label', default: 'More options')}">
                <core:icon identifier="tabler-dots-vertical" alternativeMarkupIdentifier="inline" />
                <f:if condition="{includeSubpages}">
                    <span class="pagemetrics-options-trigger-badge" aria-hidden="true"></span>
                </f:if>
            </button>
            <div class="pagemetrics-options-menu" data-options-menu hidden>
                <f:be.link route="web_layout" parameters="{id: pageId, tx_typo3pagemetrics_period: periodDays, tx_typo3pagemetrics_includeSubpages: includeSubpagesToggleValue}" additionalAttributes="{'data-include-subpages-toggle': 1}" class="pagemetrics-options-menu-item{f:if(condition: includeSubpages, then: ' pagemetrics-options-menu-item-active')}">
                    <span class="pagemetrics-options-menu-check">
                        <f:if condition="{includeSubpages}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10" /></svg>
                        </f:if>
                    </span>
                    <f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:subpages.include" default="Include subpages" />
                </f:be.link>
            </div>
        </div>
    </f:if>
</div>
<div class="pagemetrics-tiles" data-page-id="{pageId}" data-include-subpages="{includeSubpagesDataValue}" data-annotations="{f:format.json(value: annotations)}">
    <f:for each="{tiles}" as="tile">
        <div class="pagemetrics-tile" data-metric="{tile.identifier}" data-label="{tile.label}" data-description="{tile.description}" data-unit="{tile.unit.value}" data-external-link="{tile.externalLink}" data-sparkline="{f:format.json(value: tile.sparkline)}" data-redirect-share="{tile.redirectSharePercent}" style="--pm-accent: {tile.color}" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
            <div class="pagemetrics-tile-head">
                <span class="pagemetrics-tile-icon"><core:icon identifier="{tile.icon}" size="medium" alternativeMarkupIdentifier="inline" /></span>
                <div class="pagemetrics-tile-text">
                    <span class="pagemetrics-tile-main">
                        <span class="pagemetrics-tile-value">{tile.formattedValue}</span>
                        <f:if condition="{tile.deltaPercent} !== 0">
                            <f:then>
                                <f:if condition="{tile.deltaPercent} !== null">
                                    <f:then>
                                        <f:variable name="trendCurrentLine"><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:trend.explanation.current" arguments="{0: currentRangeLabel, 1: tile.formattedValue}" default="This period (%1$s): %2$s" /></f:variable>
                                        <f:variable name="trendPreviousLine"><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:trend.explanation.previous" arguments="{0: previousRangeLabel, 1: tile.previousFormattedValue}" default="Previous period (%1$s): %2$s" /></f:variable>
                                        <f:variable name="trendTitle">{trendCurrentLine}
{trendPreviousLine}</f:variable>
                                    </f:then>
                                    <f:else>
                                        <f:variable name="trendTitle"><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:trend.explanation.new" arguments="{0: previousRangeLabel}" default="No data in the previous period (%1$s) to compare against" /></f:variable>
                                    </f:else>
                                </f:if>
                                <span class="pagemetrics-tile-delta pagemetrics-tile-delta-{tile.trend.value}" title="{trendTitle}">
                                    <f:if condition="{tile.trend.value} == 'up'"><f:then><core:icon identifier="tabler-trending-up" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                                    <f:if condition="{tile.trend.value} == 'down'"><f:then><core:icon identifier="tabler-trending-down" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                                    <f:if condition="{tile.trend.value} == 'flat'"><f:then><core:icon identifier="tabler-minus" alternativeMarkupIdentifier="inline" /></f:then></f:if>
                                    <f:if condition="{tile.deltaPercent} !== null">
                                        <f:then>{tile.deltaPercent}%</f:then>
                                        <f:else><f:translate key="LLL:EXT:typo3_page_metrics/Resources/Private/Language/locallang_mod.xlf:trend.new" default="new" /></f:else>
                                    </f:if>
                                </span>
                            </f:then>
                        </f:if>
                    </span>
                    <span class="pagemetrics-tile-label">{tile.label}</span>
                </div>
            </div>
        </div>
    </f:for>
</div>
</html>
