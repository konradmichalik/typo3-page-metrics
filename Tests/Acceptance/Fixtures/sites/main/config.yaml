base: 'https://__VERSION__.__SITENAME__.ddev.site/'
dependencies:
  - typo3/fluid-styled-content
  - typo3/fluid-styled-content-css
errorHandling: {  }
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
rootPageId: 1
routes: {  }
pageMetrics:
  enabled: true
  providers:
    matomo:
      # Never-resolving TLD by design - the demo data below is seeded
      # directly into tx_typo3pagemetrics_daily/tx_typo3pagemetrics_annotation, no
      # Matomo API call is ever meant to happen against this endpoint.
      endpoint: 'https://matomo.example.invalid/'
      siteId: 1
      tokenAuth: 'dev-placeholder-token'
    accesslog:
      # Matches nothing by design, the same way the Matomo endpoint above
      # never resolves: the bot rows are seeded into tx_typo3pagemetrics_daily
      # by page_metrics_demo.sql. Drop a real log at this path to import one.
      pathPattern: '/var/www/html/.Build/__VERSION__/var/log/access.log*'
      # Matomo already answers "how many page views", and a second provider
      # offering its own would put two differently-numbered "Page views" tiles
      # side by side. This is the pairing the provider docs recommend: Matomo
      # for the audience numbers, the access log for the bot buckets only.
      metrics:
        - machine
